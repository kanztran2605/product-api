name: Product API CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/product-api

jobs:
  test:
    name: Test CRUD
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CRUD tests
        env:
          MONGODB_URI: mongodb://localhost:27017/productdb_test
        run: npm test


  docker:
    name: Build, Healthcheck and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:test

      - name: Create Docker network
        run: docker network create product-network

      - name: Start MongoDB
        run: |
          docker run -d \
            --name nammongodb \
            --network product-network \
            mongo:latest

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if docker exec nammongodb mongosh --eval "db.adminCommand('ping')" > /dev/null 2>&1; then
              echo "MongoDB is healthy"
              exit 0
            fi
            echo "Waiting for MongoDB..."
            sleep 2
          done

          echo "MongoDB failed healthcheck"
          exit 1

      - name: Start Product API
        run: |
          docker run -d \
            --name product-api \
            --network product-network \
            -p 3000:3000 \
            -e PORT=3000 \
            -e MONGODB_URI=mongodb://nammongodb:27017/productdb \
            ${{ env.IMAGE_NAME }}:test

      - name: Wait for Product API healthcheck
        run: |
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' product-api 2>/dev/null || echo "starting")

            echo "Product API status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "Product API is healthy"
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              echo "Product API is unhealthy"
              docker logs product-api
              exit 1
            fi

            sleep 2
          done

          echo "Product API healthcheck timeout"
          docker logs product-api
          exit 1

      - name: Push Docker image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}